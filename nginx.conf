server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip fuer Text-Assets
    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript text/html;

    # SPA-Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html immer frisch holen (Version liegt darin)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Statische Assets: kurzes Cache
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
